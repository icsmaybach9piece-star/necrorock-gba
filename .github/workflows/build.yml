name: Build NECROROCK GBA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devkitARM
        uses: devkitPro/gh-release@v1
        with:
          release: latest
          package: gba-dev

      - name: Build GBA ROM
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          make

      - name: Show ROM
        run: |
          ls -lh NECROROCK.gba
          file NECROROCK.gba

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: NECROROCK-GBA
          path: NECROROCK.gba
